global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: wallet
    static_configs:
      - targets:
          - wallet-1:8080
          - wallet-2:8080
          - wallet-3:8080
          - wallet-4:8080
          - wallet-5:8080
    relabel_configs: &strip_port
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance

  - job_name: router
    static_configs:
      - targets: [router-1:8080, router-2:8080]
    relabel_configs: *strip_port

  - job_name: loadgen
    static_configs:
      - targets: [loadgen:8080]
    relabel_configs: *strip_port
