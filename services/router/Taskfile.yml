version: '3'

tasks:
  build:
    desc: Build router binary into bin/
    cmds:
      - go build -o bin/router ./cmd/service

  run:
    desc: Run router locally with config.yaml
    cmds:
      - go run ./cmd/service -config config.yaml

  test:
    desc: Run router tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet on router
    cmds:
      - go vet ./...
