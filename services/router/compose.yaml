x-router: &router
  build:
    context: ..
    dockerfile: router/Dockerfile
  image: chexp/router
  restart: unless-stopped
  volumes:
    - ../../data:/data:ro

services:
  router-1:
    <<: *router
    environment: { ROUTER_NAME: router-1, SNAPSHOT_PATH: /data/snapshot.ndjson }
    ports: ["8081:8080"]
    networks:
      default:
        ipv4_address: 172.28.0.21

  router-2:
    <<: *router
    environment: { ROUTER_NAME: router-2, SNAPSHOT_PATH: /data/snapshot.ndjson }
    ports: ["8082:8080"]
    networks:
      default:
        ipv4_address: 172.28.0.22
